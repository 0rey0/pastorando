name: Testes dos robôs (sem internet)

on:
  pull_request:
  push:
    paths: ["coleta/**", "config/**", "testes/**"]

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt reportlab
      - run: python testes/teste_coleta.py
