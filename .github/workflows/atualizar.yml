name: Atualizar dados e publicar o site

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pastorando
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependência (leitura de planilhas da ALECE)
        run: pip install openpyxl
      - name: Coletar dados oficiais e calcular a Régua do Povo
        run: python coleta/rodar.py
        continue-on-error: true
      - name: Guardar os dados no repositório
        run: |
          git config user.name "pastorando-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados
          git diff --cached --quiet || git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
          git push || echo "Nada para enviar"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicar
        uses: actions/deploy-pages@v4
