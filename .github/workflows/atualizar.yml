name: Atualizar dados e publicar o site (EspiaCE)

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 6h17 (horário de Fortaleza)
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: espiace
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências (planilhas, PDFs e fotos)
        run: pip install -r requirements.txt

      # Os arquivos do TSE e do Portal da Transparência são grandes; ficam guardados entre uma rodada e outra.
      - name: Guardar downloads grandes
        uses: actions/cache@v4
        with:
          path: cache
          key: downloads-${{ github.run_id }}
          restore-keys: downloads-

      - name: Coletar dados oficiais
        run: python coleta/rodar.py
        continue-on-error: true
        env:
          PORTAL_CHAVE: ${{ secrets.PORTAL_CHAVE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          FORCAR_TSE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Guardar os dados no repositório
        run: |
          git config user.name "espiace-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          git diff --cached --quiet || git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
          git push || echo "Nada para enviar"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicar
        uses: actions/deploy-pages@v4
